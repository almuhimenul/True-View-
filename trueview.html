<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070916"><title>Real Mirror — Neon</title>
<style>
:root{--bg:#070916;--panel:#0d1022;--blue:#58a6ff;--violet:#a46bff;--text:#eef2ff;--muted:#929bb8;--line:#283050}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 20% 0%,#101c42 0%,transparent 42%),radial-gradient(ellipse at 85% 90%,#251442 0%,transparent 42%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100dvh;display:grid;place-items:center;padding:18px}.app{width:min(100%,1000px);position:relative}.top{display:flex;justify-content:space-between;align-items:center;margin:0 0 18px;padding:0 4px}.brand{display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:.14em;font-size:13px}.logo{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;border:1px solid #4c63bd;background:linear-gradient(140deg,#17234a,#27164a);box-shadow:0 0 20px #4c6cff33;color:#9dc5ff}.logo svg{width:21px}.logo{cursor:pointer;transition:transform .16s,box-shadow .2s}.logo:hover{transform:translateY(-1px);box-shadow:0 0 24px #7654ff55}.subtitle{font-size:11px;color:#a7b3d7;letter-spacing:.16em;text-transform:uppercase}
.frame{position:relative;overflow:hidden;border-radius:26px;border:1px solid #35436e;background:linear-gradient(135deg,#10162d,#090b18 60%,#16102a);aspect-ratio:4/3;min-height:260px;box-shadow:0 0 0 1px #8270ff12,0 0 38px #456aff20,0 0 50px #a04dff14;display:grid;place-items:center}.frame:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,#5ea8ff0d,#a86bff0b);z-index:1}
video{width:100%;height:100%;object-fit:cover;display:none;position:absolute;inset:0;background:#000} .empty{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px;text-align:center;z-index:2}.cam-icon{width:74px;height:74px;border-radius:23px;display:grid;place-items:center;border:1px solid #5064bb;background:linear-gradient(140deg,#17264c,#251641);box-shadow:0 0 26px #5d7aff25;color:#9fc7ff}.cam-icon svg{width:32px}.empty h1{font-size:clamp(18px,4vw,24px);margin:0;letter-spacing:.02em}.empty p{margin:0;color:var(--muted);font-size:13px;line-height:1.6;max-width:320px}
.actions{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0 10px}.btn{border:1px solid #39466f;border-radius:14px;min-height:48px;padding:0 22px;font-size:12px;font-weight:750;letter-spacing:.13em;color:#eaf0ff;background:#141a31;cursor:pointer;transition:transform .15s,box-shadow .2s,border-color .2s}.btn:active{transform:scale(.98)}.primary{border:0;background:linear-gradient(110deg,#2f86ff,#7654ff 55%,#a44bff);box-shadow:0 7px 26px #6b55ff40;color:white;min-width:156px}.primary:hover{box-shadow:0 8px 32px #6b55ff66}.secondary:hover{border-color:#7a8de3;box-shadow:0 0 18px #577bff22}.status{min-height:22px;text-align:center;color:#9ca8c8;font-size:12px}.status.live{color:#8ff0bd}.foot{display:flex;justify-content:space-between;align-items:center;color:#7883a4;font-size:11px;margin-top:18px;padding:0 4px}.pill{display:inline-flex;align-items:center;gap:7px;letter-spacing:.12em;font-weight:700}.dot{width:7px;height:7px;border-radius:50%;background:#6b7187;box-shadow:0 0 0 transparent}.dot.live{background:#5ee8a2;box-shadow:0 0 10px #5ee8a2aa}
.fullscreen{position:absolute;right:14px;top:14px;z-index:5;background:#0c1125cc;border-color:#485b92;min-width:44px;padding:0;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;backdrop-filter:blur(12px);display:none}.fullscreen svg{width:18px;height:18px}.frame.live .fullscreen{display:grid}
:fullscreen{background:#03040b!important;padding:12px!important}.frame:fullscreen{aspect-ratio:auto;width:100vw;height:100dvh;border-radius:0;border:0;box-shadow:none}.frame:fullscreen video{object-fit:contain}.frame:fullscreen .fullscreen{top:calc(env(safe-area-inset-top) + 14px);right:calc(env(safe-area-inset-right) + 14px)}

.info-overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:18px;background:#03040bd9;backdrop-filter:blur(14px)}.info-overlay.open{display:flex}.info-card{width:min(100%,520px);max-height:min(82dvh,700px);overflow:auto;border:1px solid #495b99;border-radius:24px;background:linear-gradient(145deg,#121a34f5,#121026f5 72%,#211335f5);box-shadow:0 0 45px #6755ff26,0 24px 80px #0008;padding:22px}.info-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.info-title{font-size:15px;font-weight:800;letter-spacing:.14em}.close-info{width:38px;height:38px;border-radius:12px;border:1px solid #39466f;background:#161d36;color:#dce5ff;font-size:22px;cursor:pointer}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{border:1px solid #39466f;border-radius:999px;background:#11182f;color:#aeb9da;padding:9px 13px;font-size:11px;font-weight:700;letter-spacing:.06em;cursor:pointer}.tab.active{background:linear-gradient(100deg,#2f86ff,#7654ff,#a44bff);border-color:transparent;color:white;box-shadow:0 0 18px #6b55ff30}.info-body{color:#c3cce8;font-size:13px;line-height:1.75;min-height:150px}.info-body h2{font-size:19px;color:#eef2ff;margin:2px 0 10px}.info-body p{margin:8px 0}.info-body ul{padding-left:20px;margin:8px 0}.credit-list{display:grid;gap:10px;margin-top:14px}.credit-item{padding:12px;border:1px solid #303b62;border-radius:14px;background:#10172c}.credit-item span{display:block;color:#8896bc;font-size:10px;text-transform:uppercase;letter-spacing:.14em;margin-bottom:4px}.credit-item strong{color:#eef2ff;font-size:14px}.info-note{border-top:1px solid #303b62;margin-top:16px;padding-top:12px;color:#8793b5;font-size:11px}
@media(max-width:650px){body{padding:12px}.top{margin-bottom:12px}.frame{aspect-ratio:3/4;min-height:0;border-radius:21px}.foot{gap:8px;font-size:10px}.subtitle{font-size:9px}.actions{margin-top:16px}.btn{min-height:46px}.frame:fullscreen{width:100vw;height:100dvh}}
</style></head><body>
<main class="app"><header class="top"><div class="brand"><button class="logo" id="infoOpen" aria-label="Open How to Use, About and Credits"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.4"/><path d="M7 6 8.4 3.8h5.2L15 6"/></svg></button><span>REAL MIRROR</span></div><span class="subtitle">True orientation · No flip</span></header>
<section class="frame" id="frame" aria-label="Live camera view"><video id="video" autoplay playsinline></video><div class="empty" id="empty"><div class="cam-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M8 6 9.4 4h5.2L16 6"/><circle cx="12" cy="12.5" r="3.3"/></svg></div><h1>Your reflection, in real orientation</h1><p>Start the camera to see a natural, non-mirrored live view.</p></div><button class="btn fullscreen" id="full" title="Toggle fullscreen" aria-label="Toggle fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 3H3v5M3 3l7 7M16 21h5v-5m0 5-7-7"/></svg></button></section>
<div class="actions"><button class="btn primary" id="start">START CAMERA</button><button class="btn secondary" id="stop" hidden>STOP</button></div><div class="status" id="status">Camera is off</div><footer class="foot"><span class="pill"><i class="dot" id="dot"></i><span id="state">OFFLINE</span></span><span>Nothing is captured or saved</span></footer></main>

<div class="info-overlay" id="infoOverlay" role="dialog" aria-modal="true" aria-label="Real Mirror information"><div class="info-card"><div class="info-head"><div class="info-title">REAL MIRROR <span style="color:#8c79ff">· INFO</span></div><button class="close-info" id="infoClose" aria-label="Close">×</button></div><nav class="tabs" aria-label="Information sections"><button class="tab active" data-tab="how">HOW TO USE</button><button class="tab" data-tab="about">ABOUT</button><button class="tab" data-tab="credits">CREDITS</button><button class="tab" data-tab="privacy">PRIVACY</button></nav><div class="info-body" id="infoBody"></div><div class="info-note">REAL MIRROR · True orientation · No flip</div></div></div>
<script>
const video=document.getElementById('video'),frame=document.getElementById('frame'),empty=document.getElementById('empty'),start=document.getElementById('start'),stop=document.getElementById('stop'),status=document.getElementById('status'),dot=document.getElementById('dot'),state=document.getElementById('state'),full=document.getElementById('full');let stream=null;
async function startCam(){start.disabled=true;start.textContent='CONNECTING…';status.textContent='Requesting camera permission…';try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('Camera unavailable here. Open this page from a secure HTTPS site in Chrome.');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=stream;await video.play();video.style.display='block';empty.style.display='none';frame.classList.add('live');start.hidden=true;stop.hidden=false;status.textContent='Live camera · Natural orientation';status.classList.add('live');dot.classList.add('live');state.textContent='LIVE'}catch(e){status.classList.remove('live');status.textContent=e.name==='NotAllowedError'?'Camera permission denied. Allow camera access in Chrome settings.':e.message||'Could not start camera. Try again.';start.disabled=false;start.textContent='TRY AGAIN'}}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;video.style.display='none';empty.style.display='flex';frame.classList.remove('live');start.hidden=false;start.disabled=false;start.textContent='START CAMERA';stop.hidden=true;status.classList.remove('live');status.textContent='Camera is off';dot.classList.remove('live');state.textContent='OFFLINE';if(document.fullscreenElement)document.exitFullscreen().catch(()=>{}) }

const infoOverlay=document.getElementById('infoOverlay'),infoOpen=document.getElementById('infoOpen'),infoClose=document.getElementById('infoClose'),infoBody=document.getElementById('infoBody'),tabBtns=[...document.querySelectorAll('.tab')];
const infoPages={
 how:`<h2>How to Use</h2><p>Use Real Mirror as a simple live camera mirror with the natural, non-mirrored orientation.</p><ul><li>Tap <b>START CAMERA</b>.</li><li>Allow camera access when Chrome asks.</li><li>To enlarge the view, tap the fullscreen icon while the camera is running.</li><li>Tap <b>STOP</b> to turn the camera off.</li></ul>`,
 about:`<h2>About Real Mirror</h2><p>Real Mirror displays a live camera feed without applying a left-right mirror flip, so you can see the natural camera orientation.</p><p>It is designed to be minimal, distraction-free, and easy to use.</p>`,
 credits:`<h2>Credits</h2><div class="credit-list"><div class="credit-item"><span>Founder</span><strong>Al muhimenul</strong></div><div class="credit-item"><span>Assistant</span><strong>OpenAI (ChatGPT)</strong></div></div>`,
 privacy:`<h2>Privacy</h2><p>The camera feed is displayed live in your browser. This page does not include photo capture, video recording, or save features.</p><p>Camera access can be stopped anytime using the <b>STOP</b> button or by closing the page.</p>`
};
function showInfo(tab='how'){infoOverlay.classList.add('open');infoBody.innerHTML=infoPages[tab]||infoPages.how;tabBtns.forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));}
infoOpen.addEventListener('click',()=>showInfo('how'));infoClose.addEventListener('click',()=>infoOverlay.classList.remove('open'));infoOverlay.addEventListener('click',e=>{if(e.target===infoOverlay)infoOverlay.classList.remove('open')});tabBtns.forEach(b=>b.addEventListener('click',()=>showInfo(b.dataset.tab)));document.addEventListener('keydown',e=>{if(e.key==='Escape')infoOverlay.classList.remove('open')});

start.addEventListener('click',startCam);stop.addEventListener('click',stopCam);full.addEventListener('click',async()=>{try{if(!document.fullscreenElement)await frame.requestFullscreen();else await document.exitFullscreen()}catch{status.textContent='Fullscreen is not supported by this browser.'}});window.addEventListener('pagehide',stopCam);
</script></body></html>
